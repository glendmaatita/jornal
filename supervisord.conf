; Runs the SPA server and PocketBase in a single container.
; Both programs log to container stdout/stderr and restart on failure.
; POCKETBASE_SUPERUSER_EMAIL / POCKETBASE_SUPERUSER_PASSWORD (optional container
; env, typically from a k8s Secret) are used to upsert the PocketBase superuser
; on startup so the admin dashboard is reachable via `kubectl port-forward`.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=bun run server.ts
directory=/app
user=bun
priority=10
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pocketbase]
command=/bin/sh -c 'if [ -n "$POCKETBASE_SUPERUSER_EMAIL" ] && [ -n "$POCKETBASE_SUPERUSER_PASSWORD" ]; then /pb/pocketbase superuser upsert "$POCKETBASE_SUPERUSER_EMAIL" "$POCKETBASE_SUPERUSER_PASSWORD" --dir=/pb/pb_data; fi; exec /pb/pocketbase serve --http=0.0.0.0:8090 --dir=/pb/pb_data'
directory=/pb
user=bun
priority=10
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
